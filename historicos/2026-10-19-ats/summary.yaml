text: |
  Desarrollador Full-Stack e Ingeniero Electrónico con más de 5 años de experiencia en el desarrollo de aplicaciones web y más de 10 años en automatización industrial y desarrollo de software. Especializado en React, Next.js, TypeScript, Node.js y NestJS, con experiencia en el diseño de interfaces accesibles y responsive, gestión de estado, formularios complejos, validación de datos y consumo de APIs REST.

  Experiencia en backend con arquitecturas limpias y servicios desacoplados, utilizando PostgreSQL, MySQL y MongoDB con Prisma, Sequelize, Mongoose y Eloquent ORM. Conocimientos en Laravel, PHP, Java, Spring Boot, Docker, Git y Figma.

  Orientado a resultados, con experiencia en levantamiento de requerimientos, diseño, implementación, despliegue y documentación técnica. Interesado en roles de Desarrollador Full-Stack, Frontend o Backend.
