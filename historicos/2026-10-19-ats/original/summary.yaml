text: |
  Desarrollador Web <em>full-stack</em> e Ingeniero Electrónico con más de <em>5 años</em> de experiencia en desarrollo web y más de <em>10 años</em> en automatización industrial y software. Especializado en la construcción de aplicaciones web modernas, performantes y escalables utilizando React y Next.js, con fuerte enfoque en experiencia de usuario, accesibilidad y diseño responsive.

  Sólida experiencia en desarrollo <em>frontend</em> con TypeScript, manejo avanzado de estado, formularios complejos, validaciones y consumo de APIs REST, así como en desarrollo <em>backend</em> con Node.js y NestJS, diseñando arquitecturas limpias, servicios desacoplados y persistencia de datos mediante ORMs y ODMs (Prisma, Sequelize, Mongoose) sobre bases de datos SQL y NoSQL.

  Cuenta con experiencia previa en PHP y Laravel, control de versiones con Git, y diseño de interfaces en Figma, participando en todo el ciclo de vida del producto: levantamiento de requerimientos, diseño, implementación, despliegue y documentación técnica.
